<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBDA 选股系统 v4.3</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-green { animation: pulseGreen 2s infinite; }
        @keyframes pulseGreen { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } }
        .pulse-red { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        textarea::placeholder { color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📈</span>
                <h1 class="text-lg font-bold text-gray-800">BBDA 选股系统 <span class="text-primary text-sm">v4.3</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="todayDate" class="text-sm text-gray-500"></span>
                <button onclick="exportToday()" class="text-gray-400 hover:text-primary" title="导出今日记录">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">
        <!-- autoclaw 粘贴区 -->
        <section class="bg-white rounded-xl shadow-sm p-4 fade-in">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-semibold text-gray-800">
                    <i class="fas fa-paste mr-2 text-primary"></i>autoclaw 结论粘贴区
                </h2>
                <button onclick="parseClipboard()" class="text-sm text-primary hover:underline">
                    <i class="fas fa-magic mr-1"></i>智能解析
                </button>
            </div>
            <textarea id="autoclawInput" rows="4"
                class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm resize-none focus:ring-2 focus:ring-primary focus:border-primary"
                placeholder="粘贴 autoclaw 扫描结论...

例如：
- 沪深300: MA20上方，趋势+1
- 中证1000: MA20上方，趋势+1
- 两市成交: 5日/120日 = 1.15，流动性+2
- 涨停溢价: +3.2%，情绪+2
- 板块: AI应用正式确认，资金集中度OK"></textarea>
            <div class="flex gap-2 mt-2">
                <button onclick="quickFillMarket()" class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                    <i class="fas fa-bolt mr-1"></i>快速填充市场评分
                </button>
                <button onclick="clearInput()" class="px-3 py-1.5 text-xs text-gray-500 hover:text-gray-700 transition">
                    清空
                </button>
            </div>
        </section>

        <!-- 今日决策 -->
        <section class="bg-white rounded-xl shadow-sm p-4 fade-in">
            <h2 class="font-semibold text-gray-800 mb-4">
                <i class="fas fa-rocket mr-2 text-primary"></i>今日决策
                <span id="visitorBadge" class="hidden ml-2 px-2 py-0.5 text-xs bg-primary text-white rounded-full"></span>
            </h2>

            <!-- 市场状态 -->
            <div class="grid grid-cols-3 gap-3 mb-4">
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <div class="text-xs text-gray-500 mb-1">趋势</div>
                    <select id="trendScore" class="w-full text-center font-bold border-0 bg-transparent" onchange="updateMarketDecision()">
                        <option value="">--</option>
                        <option value="2">2分 强</option>
                        <option value="1">1分 中</option>
                        <option value="0">0分 弱</option>
                    </select>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <div class="text-xs text-gray-500 mb-1">流动性</div>
                    <select id="liquidityScore" class="w-full text-center font-bold border-0 bg-transparent" onchange="updateMarketDecision()">
                        <option value="">--</option>
                        <option value="2">2分 活跃</option>
                        <option value="1">1分 中性</option>
                        <option value="0">0分 萎缩</option>
                    </select>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <div class="text-xs text-gray-500 mb-1">情绪</div>
                    <select id="sentimentScore" class="w-full text-center font-bold border-0 bg-transparent" onchange="updateMarketDecision()">
                        <option value="">--</option>
                        <option value="2">2分 好</option>
                        <option value="1">1分 中</option>
                        <option value="0">0分 差</option>
                    </select>
                </div>
            </div>

            <!-- 风格匹配 -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="p-3 bg-gray-50 rounded-lg">
                    <div class="text-xs text-gray-500 mb-1">中证1000涨幅%</div>
                    <input type="number" id="zz1000Change" step="0.01" placeholder="0.0"
                        class="w-full text-center font-medium border-0 bg-transparent focus:outline-none" oninput="updateStyleMatch()">
                </div>
                <div class="p-3 bg-gray-50 rounded-lg">
                    <div class="text-xs text-gray-500 mb-1">沪深300涨幅%</div>
                    <input type="number" id="hs300Change" step="0.01" placeholder="0.0"
                        class="w-full text-center font-medium border-0 bg-transparent focus:outline-none" oninput="updateStyleMatch()">
                </div>
            </div>

            <!-- 核心结论 -->
            <div id="marketConclusion" class="p-4 rounded-xl border-2 border-gray-200 text-center">
                <div class="text-4xl mb-2">⏳</div>
                <div class="text-lg font-bold text-gray-500">等待评分...</div>
                <div class="text-sm text-gray-400 mt-1">选择各维度得分获取决策建议</div>
            </div>
        </section>

        <!-- 打赏区域 -->
        <section class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl shadow-sm p-6 text-center fade-in">
            <div class="text-3xl mb-3">☕</div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">觉得好用？请作者喝杯咖啡 ☕</h3>
            <p class="text-sm text-gray-600 mb-4">您的支持是我持续更新的动力</p>
            <button onclick="showDonateModal()" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition">
                <i class="fas fa-heart mr-2"></i>打赏支持
            </button>
        </section>

        <!-- 仓位计算 -->
        <section class="bg-white rounded-xl shadow-sm p-4 fade-in">
            <h2 class="font-semibold text-gray-800 mb-4">
                <i class="fas fa-calculator mr-2 text-primary"></i>仓位计算
            </h2>

            <div class="grid grid-cols-4 gap-3 mb-4">
                <div>
                    <label class="text-xs text-gray-500">账户(万)</label>
                    <input type="number" id="account" placeholder="10" value="10"
                        class="w-full px-3 py-2 border rounded-lg text-center font-medium" oninput="calcPosition()">
                </div>
                <div>
                    <label class="text-xs text-gray-500">风险%</label>
                    <input type="number" id="riskPct" value="1" step="0.1"
                        class="w-full px-3 py-2 border rounded-lg text-center font-medium" oninput="calcPosition()">
                </div>
                <div>
                    <label class="text-xs text-gray-500">止损%</label>
                    <input type="number" id="stopLossPct" placeholder="5" step="0.1"
                        class="w-full px-3 py-2 border rounded-lg text-center font-medium" oninput="calcPosition()">
                </div>
                <div>
                    <label class="text-xs text-gray-500">ATR</label>
                    <input type="number" id="atrValue" placeholder="0.3" step="0.01"
                        class="w-full px-3 py-2 border rounded-lg text-center font-medium" oninput="calcPosition()">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="text-center p-3 bg-blue-50 rounded-lg">
                    <div class="text-xs text-gray-500">单票仓位</div>
                    <div id="positionAmt" class="text-2xl font-bold text-primary">--</div>
                </div>
                <div class="text-center p-3 bg-green-50 rounded-lg">
                    <div class="text-xs text-gray-500">首仓允许亏损</div>
                    <div id="maxLoss" class="text-2xl font-bold text-success">--</div>
                </div>
                <div class="text-center p-3 bg-yellow-50 rounded-lg">
                    <div class="text-xs text-gray-500">ATR止损</div>
                    <div id="atrStop" class="text-lg font-bold text-warning">--</div>
                </div>
            </div>
        </section>

        <!-- 今日操作记录 -->
        <section class="bg-white rounded-xl shadow-sm p-4 fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold text-gray-800">
                    <i class="fas fa-list mr-2 text-primary"></i>今日操作记录
                </h2>
                <button onclick="showAddTrade()" class="px-3 py-1.5 bg-primary text-white text-sm rounded-lg hover:bg-blue-600 transition">
                    <i class="fas fa-plus mr-1"></i>添加
                </button>
            </div>

            <div id="tradeList" class="space-y-2">
                <div id="emptyTrades" class="text-center py-8 text-gray-400">
                    <i class="fas fa-inbox text-3xl mb-2"></i>
                    <p>暂无操作记录</p>
                    <p class="text-xs mt-1">点击上方"添加"记录你的买卖操作</p>
                </div>
            </div>
        </section>

        <!-- 持仓监控 -->
        <section class="bg-white rounded-xl shadow-sm p-4 fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold text-gray-800">
                    <i class="fas fa-shield-alt mr-2 text-primary"></i>持仓监控
                </h2>
                <button onclick="togglePositions()" class="text-sm text-gray-500 hover:text-primary">
                    <span id="toggleText">展开</span>
                </button>
            </div>

            <div id="positionList" class="space-y-2 hidden">
                <div id="emptyPositions" class="text-center py-6 text-gray-400">
                    <i class="fas fa-wallet text-3xl mb-2"></i>
                    <p>暂无持仓</p>
                </div>
            </div>

            <div id="positionSummary" class="p-3 bg-gray-50 rounded-lg text-center text-gray-500">
                <span id="positionSummaryText">今日无持仓</span>
            </div>
        </section>

        <!-- 执行清单 -->
        <section class="bg-white rounded-xl shadow-sm p-4 fade-in">
            <h2 class="font-semibold text-gray-800 mb-4">
                <i class="fas fa-clipboard-check mr-2 text-primary"></i>今日执行清单
            </h2>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <button onclick="toggleCheck('pm')" id="check-pm" class="check-btn p-3 rounded-lg border-2 border-gray-200 text-center transition">
                    <div class="text-lg mb-1">📸</div>
                    <div class="text-xs font-medium">15:05 快照</div>
                </button>
                <button onclick="toggleCheck('evening')" id="check-evening" class="check-btn p-3 rounded-lg border-2 border-gray-200 text-center transition">
                    <div class="text-lg mb-1">🌙</div>
                    <div class="text-xs font-medium">晚间复盘</div>
                </button>
                <button onclick="toggleCheck('nextday')" id="check-nextday" class="check-btn p-3 rounded-lg border-2 border-gray-200 text-center transition">
                    <div class="text-lg mb-1">☀️</div>
                    <div class="text-xs font-medium">次日盘中</div>
                </button>
            </div>

            <div class="flex items-center justify-between p-3 bg-blue-50 rounded-lg">
                <span class="text-sm text-gray-600">今日完成度</span>
                <div class="flex items-center gap-2">
                    <div class="w-24 h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div id="checkProgress" class="h-full bg-primary rounded-full transition-all" style="width: 0%"></div>
                    </div>
                    <span id="checkProgressText" class="text-sm font-medium text-primary">0%</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 添加交易弹窗 -->
    <div id="tradeModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="p-4 border-b flex items-center justify-between">
                <h3 class="font-semibold">添加操作记录</h3>
                <button onclick="closeTradeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">操作类型</label>
                        <select id="tradeType" class="w-full px-3 py-2 border rounded-lg">
                            <option value="buy">🟢 买入</option>
                            <option value="sell">🔴 卖出</option>
                            <option value="stop">🟡 止损</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">时间</label>
                        <input type="time" id="tradeTime" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">股票代码</label>
                        <input type="text" id="tradeCode" placeholder="600519" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">价格</label>
                        <input type="number" id="tradePrice" step="0.01" placeholder="1850" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">数量(手)</label>
                        <input type="number" id="tradeQty" placeholder="1" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">止损价(可选)</label>
                        <input type="number" id="tradeStop" step="0.01" placeholder="1800" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-500">备注</label>
                    <input type="text" id="tradeNote" placeholder="买点类型/原因" class="w-full px-3 py-2 border rounded-lg">
                </div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeTradeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg transition">取消</button>
                <button onclick="addTrade()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 bg-gray-800 text-white rounded-full shadow-lg transform translate-y-20 opacity-0 transition-all duration-300">
        <span id="toastMsg"></span>
    </div>

    <!-- 昵称弹窗 -->
    <div id="nicknameModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="p-6 text-center">
                <div class="text-4xl mb-3">👋</div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">欢迎使用 BBDA</h3>
                <p class="text-sm text-gray-500 mb-4">请告诉我你的昵称</p>
                <input type="text" id="nicknameInput" placeholder="输入昵称" maxlength="20"
                    class="w-full px-4 py-3 border-2 border-primary rounded-lg text-center text-lg focus:outline-none">
                <button onclick="saveNickname()" class="w-full mt-3 px-4 py-3 bg-primary text-white font-bold rounded-lg hover:bg-blue-600 transition">
                    开始使用
                </button>
            </div>
        </div>
    </div>

    <!-- 打赏弹窗 -->
    <div id="donateModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="p-4 border-b flex items-center justify-between">
                <h3 class="font-semibold text-gray-800">☕ 打赏作者</h3>
                <button onclick="closeDonateModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 text-center">
                <img src="donate.jpg" alt="微信收款码" class="w-64 h-64 mx-auto rounded-lg shadow-md">
                <p class="text-sm text-gray-500 mt-4">识别上方二维码<br>金额随意，感谢支持 🙏</p>
            </div>
        </div>
    </div>

    <script>
        // ========== State ==========
        let todayKey = new Date().toISOString().split('T')[0];
        let marketDecision = { total: 0, status: '', positionLimit: 0, strategy: '' };
        let styleAdjustment = 1;
        let trades = [];
        let positions = [];
        let checks = { pm: false, evening: false, nextday: false };

        // ========== Init ==========
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
            document.getElementById('tradeTime').value = new Date().toTimeString().slice(0, 5);
            loadData();
            updateUI();
            checkNickname();
        });

        // ========== Nickname ==========
        function checkNickname() {
            const savedNickname = localStorage.getItem('bbda_nickname');
            if (savedNickname) {
                document.getElementById('visitorBadge').textContent = savedNickname;
                document.getElementById('visitorBadge').classList.remove('hidden');
            } else {
                document.getElementById('nicknameModal').classList.remove('hidden');
                document.getElementById('nicknameModal').classList.add('flex');
                document.getElementById('nicknameInput').focus();
            }
        }

        function saveNickname() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if (nickname) {
                localStorage.setItem('bbda_nickname', nickname);
                document.getElementById('visitorBadge').textContent = nickname;
                document.getElementById('visitorBadge').classList.remove('hidden');
                closeNicknameModal();
                showToast(`欢迎 ${nickname}！`, 'success');
            }
        }

        function closeNicknameModal() {
            document.getElementById('nicknameModal').classList.add('hidden');
            document.getElementById('nicknameModal').classList.remove('flex');
        }

        // ========== Donation ==========
        function showDonateModal() {
            document.getElementById('donateModal').classList.remove('hidden');
            document.getElementById('donateModal').classList.add('flex');
        }

        function closeDonateModal() {
            document.getElementById('donateModal').classList.add('hidden');
            document.getElementById('donateModal').classList.remove('flex');
        }

        // ========== Market Decision ==========
        function updateMarketDecision() {
            const trend = parseInt(document.getElementById('trendScore').value) || 0;
            const liquidity = parseInt(document.getElementById('liquidityScore').value) || 0;
            const sentiment = parseInt(document.getElementById('sentimentScore').value) || 0;
            const total = trend + liquidity + sentiment;
            marketDecision.total = total;

            const box = document.getElementById('marketConclusion');
            let icon, status, limit, strategy, color;

            if (total <= 1) {
                icon = '🚫'; status = 'Risk-Off 防守'; limit = '0%'; strategy = '空仓，不开新仓';
                color = 'danger'; box.className = 'p-4 rounded-xl border-2 border-red-300 bg-red-50 text-center';
            } else if (total === 2) {
                icon = '⚠️'; status = '弱中性'; limit = '≤20%'; strategy = '不开新主仓，极小试仓';
                color = 'warning'; box.className = 'p-4 rounded-xl border-2 border-yellow-300 bg-yellow-50 text-center';
            } else if (total <= 4) {
                icon = '🟡'; status = 'Neutral 中性'; limit = '≤40%'; strategy = '只做预确认板块龙头试仓';
                color = 'warning'; box.className = 'p-4 rounded-xl border-2 border-yellow-300 bg-yellow-50 text-center';
            } else if (total === 5) {
                icon = '🟢'; status = 'Risk-On 进攻'; limit = '≤70%'; strategy = '可做确认板块主升浪';
                color = 'success'; box.className = 'p-4 rounded-xl border-2 border-green-300 bg-green-50 text-center pulse-green';
            } else {
                icon = '🔥'; status = '强进攻'; limit = '≤70%'; strategy = '只做核心龙头回踩，不追后排';
                color = 'success'; box.className = 'p-4 rounded-xl border-2 border-green-300 bg-green-50 text-center';
            }

            marketDecision = { total, status, positionLimit: parseInt(limit) || 0, strategy };

            const limitAdjusted = marketDecision.positionLimit * styleAdjustment;
            const limitText = styleAdjustment < 1 ? `→ ${limitAdjusted}%（风格分化×0.5）` : `→ ${limitAdjusted}%`;

            box.innerHTML = `
                <div class="text-5xl mb-2">${icon}</div>
                <div class="text-3xl font-bold text-${color}-600">${status}</div>
                <div class="text-lg text-${color}-600 mt-2">${total} / 6 分</div>
                <div class="text-sm text-gray-600 mt-2">仓位上限 ${limitText}</div>
                <div class="text-sm text-gray-500 mt-1">${strategy}</div>
            `;

            calcPosition();
        }

        function updateStyleMatch() {
            const zz1000 = parseFloat(document.getElementById('zz1000Change').value) || 0;
            const hs300 = parseFloat(document.getElementById('hs300Change').value) || 0;
            const diff = zz1000 - hs300;

            if (Math.abs(diff) > 1) {
                styleAdjustment = diff > 0 ? 1 : 0.5;
                const text = diff > 0 ? '中小盘强势 ✓' : '二八分化 ⚠️ 仓位×0.5';
                showToast(text, diff > 0 ? 'success' : 'warning');
            } else {
                styleAdjustment = 1;
            }

            updateMarketDecision();
        }

        // ========== Position Calculator ==========
        function calcPosition() {
            const account = parseFloat(document.getElementById('account').value) || 0;
            const riskPct = parseFloat(document.getElementById('riskPct').value) || 1;
            const stopLossPct = parseFloat(document.getElementById('stopLossPct').value) || 0;
            const atrValue = parseFloat(document.getElementById('atrValue').value) || 0;

            if (account > 0 && riskPct > 0 && stopLossPct > 0) {
                const maxLoss = account * 10000 * (riskPct / 100);
                const positionAmt = maxLoss / (stopLossPct / 100);
                const atrStop = atrValue > 0 ? Math.max(stopLossPct, atrValue * 100 / 5) : stopLossPct;

                document.getElementById('maxLoss').textContent = maxLoss.toFixed(0);
                document.getElementById('positionAmt').textContent = positionAmt.toFixed(0);
                document.getElementById('atrStop').textContent = atrStop.toFixed(1) + '%';
            }
        }

        // ========== Quick Fill ==========
        function quickFillMarket() {
            const input = document.getElementById('autoclawInput').value.toLowerCase();

            // 解析趋势
            if (input.includes('ma20上方') || input.includes('站上ma20')) {
                document.getElementById('trendScore').value = '2';
            } else if (input.includes('ma20附近') || input.includes('震荡')) {
                document.getElementById('trendScore').value = '1';
            } else if (input.includes('ma20下方') || input.includes('跌破')) {
                document.getElementById('trendScore').value = '0';
            }

            // 解析流动性
            if (input.includes('1.1') || input.includes('1.15') || input.includes('1.2')) {
                document.getElementById('liquidityScore').value = '2';
            } else if (input.includes('0.9') || input.includes('0.95')) {
                document.getElementById('liquidityScore').value = '0';
            } else if (input.includes('1.0') || input.includes('1.05')) {
                document.getElementById('liquidityScore').value = '1';
            }

            // 解析情绪
            if (input.includes('溢价') && !input.includes('负') && !input.includes('差')) {
                document.getElementById('sentimentScore').value = '2';
            } else if (input.includes('溢价') && (input.includes('负') || input.includes('差') || input.includes('高'))) {
                document.getElementById('sentimentScore').value = '0';
            } else {
                document.getElementById('sentimentScore').value = '1';
            }

            // 解析风格
            const zzMatch = input.match(/中证.*?([+-]?[\d.]+)%/);
            const hsMatch = input.match(/沪深.*?([+-]?[\d.]+)%/);
            if (zzMatch) document.getElementById('zz1000Change').value = zzMatch[1];
            if (hsMatch) document.getElementById('hs300Change').value = hsMatch[1];

            updateMarketDecision();
            showToast('已自动解析指标', 'success');
        }

        function parseClipboard() {
            // 尝试从剪贴板获取内容
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(text => {
                    document.getElementById('autoclawInput').value = text;
                    quickFillMarket();
                }).catch(() => {
                    document.getElementById('autoclawInput').focus();
                    showToast('请手动粘贴内容', 'warning');
                });
            } else {
                document.getElementById('autoclawInput').focus();
                showToast('请手动粘贴', 'warning');
            }
        }

        function clearInput() {
            document.getElementById('autoclawInput').value = '';
        }

        // ========== Trade Management ==========
        function showAddTrade() {
            document.getElementById('tradeModal').classList.remove('hidden');
            document.getElementById('tradeModal').classList.add('flex');
            document.getElementById('tradeCode').focus();
        }

        function closeTradeModal() {
            document.getElementById('tradeModal').classList.add('hidden');
            document.getElementById('tradeModal').classList.remove('flex');
        }

        function addTrade() {
            const code = document.getElementById('tradeCode').value.trim();
            const type = document.getElementById('tradeType').value;
            const price = parseFloat(document.getElementById('tradePrice').value);
            const qty = parseInt(document.getElementById('tradeQty').value) || 1;
            const stop = parseFloat(document.getElementById('tradeStop').value) || 0;
            const note = document.getElementById('tradeNote').value.trim();
            const time = document.getElementById('tradeTime').value;

            if (!code || !price) {
                showToast('请填写股票代码和价格', 'warning');
                return;
            }

            const trade = {
                id: Date.now(),
                type, code, price, qty, stop, note, time,
                date: todayKey
            };

            trades.push(trade);
            saveData();
            renderTrades();
            closeTradeModal();
            showToast(`${type === 'buy' ? '买入' : type === 'sell' ? '卖出' : '止损'}记录已添加`, 'success');
        }

        function deleteTrade(id) {
            trades = trades.filter(t => t.id !== id);
            saveData();
            renderTrades();
            showToast('记录已删除', 'info');
        }

        function renderTrades() {
            const container = document.getElementById('tradeList');
            const empty = document.getElementById('emptyTrades');

            if (trades.length === 0) {
                empty.classList.remove('hidden');
                container.innerHTML = '';
                container.appendChild(empty);
                return;
            }

            empty.classList.add('hidden');
            container.innerHTML = trades.map(t => {
                const typeIcon = t.type === 'buy' ? '🟢' : t.type === 'sell' ? '🔴' : '🟡';
                const typeText = t.type === 'buy' ? '买入' : t.type === 'sell' ? '卖出' : '止损';
                const amount = (t.price * t.qty * 100).toLocaleString();
                return `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <span class="text-lg">${typeIcon}</span>
                            <div>
                                <div class="font-medium">${t.code}</div>
                                <div class="text-xs text-gray-500">${t.time} · ${typeText} ${t.qty}手 @ ¥${t.price.toFixed(2)}</div>
                                ${t.note ? `<div class="text-xs text-gray-400 mt-1">${t.note}</div>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            ${t.stop ? `<div class="text-xs text-danger">止损 ¥${t.stop}</div>` : ''}
                            <div class="text-sm font-medium">¥${amount}</div>
                            <button onclick="deleteTrade(${t.id})" class="text-gray-400 hover:text-danger">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== Checklist ==========
        function toggleCheck(key) {
            checks[key] = !checks[key];
            const btn = document.getElementById('check-' + key);
            if (checks[key]) {
                btn.classList.remove('border-gray-200');
                btn.classList.add('border-primary', 'bg-blue-50');
            } else {
                btn.classList.add('border-gray-200');
                btn.classList.remove('border-primary', 'bg-blue-50');
            }
            updateCheckProgress();
            saveData();
        }

        function updateCheckProgress() {
            const total = 3;
            const done = Object.values(checks).filter(Boolean).length;
            const pct = Math.round((done / total) * 100);
            document.getElementById('checkProgress').style.width = pct + '%';
            document.getElementById('checkProgressText').textContent = pct + '%';
        }

        function togglePositions() {
            const list = document.getElementById('positionList');
            const text = document.getElementById('toggleText');
            list.classList.toggle('hidden');
            text.textContent = list.classList.contains('hidden') ? '展开' : '收起';
        }

        // ========== Storage ==========
        function saveData() {
            const data = {
                date: todayKey,
                market: {
                    trend: document.getElementById('trendScore').value,
                    liquidity: document.getElementById('liquidityScore').value,
                    sentiment: document.getElementById('sentimentScore').value,
                    zz1000: document.getElementById('zz1000Change').value,
                    hs300: document.getElementById('hs300Change').value,
                    decision: marketDecision
                },
                trades,
                checks
            };
            localStorage.setItem('decision_' + todayKey, JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('decision_' + todayKey);
            if (saved) {
                const data = JSON.parse(saved);
                if (data.market) {
                    document.getElementById('trendScore').value = data.market.trend || '';
                    document.getElementById('liquidityScore').value = data.market.liquidity || '';
                    document.getElementById('sentimentScore').value = data.market.sentiment || '';
                    document.getElementById('zz1000Change').value = data.market.zz1000 || '';
                    document.getElementById('hs300Change').value = data.market.hs300 || '';
                    if (data.market.decision) {
                        marketDecision = data.market.decision;
                    }
                    updateMarketDecision();
                }
                if (data.trades) {
                    trades = data.trades;
                    renderTrades();
                }
                if (data.checks) {
                    checks = data.checks;
                    Object.keys(checks).forEach(key => {
                        if (checks[key]) toggleCheck(key);
                    });
                }
            }
        }

        function exportToday() {
            const data = localStorage.getItem('decision_' + todayKey);
            if (!data) {
                showToast('今日暂无数据', 'warning');
                return;
            }
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BBDA决策_${todayKey}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('已导出', 'success');
        }

        function updateUI() {
            renderTrades();
            updateCheckProgress();
            if (marketDecision.total > 0) {
                updateMarketDecision();
            }
        }

        // ========== Toast ==========
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            const colors = { success: 'bg-green-600', warning: 'bg-yellow-500', danger: 'bg-red-600', info: 'bg-gray-800' };
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 ${colors[type]} text-white rounded-full shadow-lg transition-all duration-300`;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
